---
# Playbook lingfra.system.pkg_manager

- name: "Configure package managers"
  hosts: "{{ target | default('all') }}"
  gather_facts: true
  tags:
    - pkg_manager
  tasks:
    - name: "Include role lingfra.system.pacman"
      ansible.builtin.include_role:
        name: lingfra.system.pacman
      tags:
        - pacman
      when:
        - ansible_facts['pkg_mgr'] == 'pacman'

    - name: "Include role lingfra.system.apt_source"
      ansible.builtin.include_role:
        name: lingfra.system.apt_source
      tags:
        - apt_source
      when:
        - ansible_facts['pkg_mgr'] == 'apt'
