---
# tasks file for mkinitcpio_sd_tool

- name: "Install dependencies for mkinitcpio-systemd-tool"
  ansible.builtin.command:
    argv: "{{ (['pacman', '-Sy', '--noconfirm'] + mkinitcpio_sd_tool_packages) | lingfra.system.arch_chroot_argv(mkinitcpio_sd_tool_chroot_dir) }}"
  changed_when: true
  become: true
  tags:
    - configure
    - mkinitcpio_sd_tool

- name: "Enable required units for mkinitcpio-systemd-tool with command module for chroot"
  ansible.builtin.command:
    argv: "{{ ['systemctl', 'enable', unit] | lingfra.system.arch_chroot_argv(mkinitcpio_sd_tool_chroot_dir) }}"
  become: true
  changed_when: true
  loop: "{{ mkinitcpio_sd_tool_units }}"
  loop_control:
    loop_var: unit
  register: mkinitcpio_sd_tool_systemd_result
  tags:
    - configure
    - mkinitcpio_sd_tool
