---
# argument specs file for lingfra.system.sd_networkd

argument_specs:
  main:
    short_description: "Main entry point for lingfra.system.sd_networkd role"
    description:
      - "This is the main entrypoint for the lingfra.system.sd_networkd role."
    author:
      - "lingling"
    options:
      sd_networkd_chroot_path:
        type: "str"
        required: false
        description:
          - "If specified, all actions are executed inside the chroot."
      sd_networkd_conf_ipv6_privacy_extensions:
        type: "bool"
        required: false
