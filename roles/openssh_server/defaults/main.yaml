---
# Automatically generated by aar-doc
# Whether or not to load drop in files.
openssh_server_conf_enable_drop_ins: true
# Whether or not to enable SFTP (SSH File Transfer Protocol).
openssh_server_conf_enable_sftp: true
# Please be sure to read and understand this options before modifying it, see [**sshd_config(5)** AuthenticationMethods](https://man.archlinux.org/man/sshd_config.5.en#AuthenticationMethods)
# You can disable this option by setting it to `null` or an empty string.
# To mimic the example from the man page, set this variable to `['publickey,password', 'publickey,keyboard-interactive']`.
openssh_server_conf_authentication_methods:
  - publickey
openssh_server_conf_kbd_interactive_authentication: false
openssh_server_conf_max_auth_tries: 3
openssh_server_conf_password_authentication: false
openssh_server_conf_permit_empty_passwords: false
# Whether root is allowed to login over ssh or not.
openssh_server_conf_permit_root_login: false
openssh_server_conf_pubkey_authentication: true
openssh_server_conf_use_pam: true
openssh_server_host_key_types:
  - ed25519
# Setting this to true will delete all host keys.
# Use with care!
openssh_server_host_key_reset: false
# Whether the OpenSSH system packages should be installed or not.
openssh_server_install: true
# Whether the OpenSSH systemd service should be enabled or not.
# If the service is already running and this variable is set to `false` it disables the service.
# This option has no effect if [`openssh_server_chroot_path`](#openssh_server_chroot_path) is defined.
openssh_server_systemd_service_enable: true
# Whether the OpenSSH systemd service should be (re-)started or not.
# This option has no effect if [`openssh_server_chroot_path`](#openssh_server_chroot_path) is defined.
openssh_server_systemd_service_restart: true
