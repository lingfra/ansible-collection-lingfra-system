---
# tasks file for pkgs

- name: "Update package cache with {{ ansible_facts['pkg_mgr'] }}"
  community.general.apk:
    update_cache: true
  become: true

- name: "Install packages with {{ ansible_facts['pkg_mgr'] }}"
  community.general.apk:
    name: "{{ pkgs_present }}"
    state: present
  become: true

- name: "Remove packages with {{ ansible_facts['pkg_mgr'] }}"
  community.general.apk:
    name: "{{ pkgs_absent }}"
    state: absent
  become: true
