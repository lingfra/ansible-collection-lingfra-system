---
# vars file for pkgs

pkgs_absent: "{{ pkgs_absent__host
  | ansible.builtin.union(pkgs_absent__global[ansible_facts['distribution'] ~ ansible_facts['distribution_major_version']] | default([]))
  | ansible.builtin.union(pkgs_absent__global[ansible_facts['distribution']] | default([]))
  | ansible.builtin.union(pkgs_absent__global['all'] | default([]))
  }}"

pkgs_present: "{{ pkgs_present__host
  | ansible.builtin.union(pkgs_present__global[ansible_facts['distribution'] ~ ansible_facts['distribution_major_version']] | default([]))
  | ansible.builtin.union(pkgs_present__global[ansible_facts['distribution']] | default([]))
  | ansible.builtin.union(pkgs_present__global['all'] | default([]))
  }}"
