---
# tasks file for partitions

# ---------- Device Partioning ----------

# The first partition on a device is either a 1 MiB BIOS boot partition for
# systems with a legacy BIOS (often the case for VMs) or an EFI partition with
# 512 MiB for modern UEFI systems (often the case for hardware machines).

- name: "Create BIOS boot partition (Only for BIOS systems)"
  community.general.parted:
    device: "{{ partitions_device }}"
    flags:
      - bios_grub
    label: gpt
    name: bios_boot
    number: 1
    part_end: 1MiB
    state: present
  become: true
  tags:
    - configure
    - parted
    - partitions
  when: partitions_system_type == 'bios'

- name: "Create EFI boot partition (Only for UEFI systems)"
  community.general.parted:
    device: "{{ partitions_device }}"
    flags:
      - esp
    label: gpt
    name: esp
    number: 1
    part_end: 512MiB
    state: present
  tags:
    - configure
    - parted
    - partitions
  when: partitions_system_type == 'uefi'

# The second partition occupies the remaining space on the device.

- name: "Create root partition"
  community.general.parted:
    device: "{{ partitions_device }}"
    flags: "{{ ['lvm'] if (partitions_root_partition_type == 'lvm' and partitions_root_partition_password is not defined) else omit }}"
    label: gpt
    name: root
    number: 2
    part_end: "100%"
    part_start: "{{ '512MiB' if partitions_system_type == 'uefi' else '1MiB' }}"
    state: present
  become: true
  tags:
    - configure
    - parted
    - partitions

- name: "Set partition type"
  ansible.builtin.command:
    argv:
      - parted
      - "{{ partitions_device }}"
      - type
      - 2
      - 4f68bce3-e8cd-4db1-96e7-fbcaf984b709
  become: true
  changed_when: true
  tags:
    - configure
    - parted
    - partitions
  when: partitions_system_type == 'uefi'

- name: "Register partition layout"
  community.general.parted:
    device: "{{ partitions_device }}"
  become: true
  register: parted_result
  tags:
    - configure
    - partitions

# ---------- Filesystems ----------

- name: "Include tasks filesystems.yaml"
  ansible.builtin.include_tasks:
    file: filesystems.yaml
    apply:
      tags:
        - configure
        - parted
        - partitions
  vars:
    partitions_devices: "{{ parted_result | lingfra.system.get_partition_block_device_names }}"

- name: "Update mount facts"
  ansible.builtin.mount_facts:
    devices:
      - "{{ partitions_device }}"

# ---------- Clean-Up ----------

- name: "Nullify runtime variables of parted"
  ansible.builtin.set_fact:
    parted_result: null
  tags:
    - clean-up
    - partitions
