---
# argument specs file for partitions

argument_specs:
  main:
    short_description: "Main entry point for partitions role"
    description:
      - "This entry point creates the partitions on a device."
      - ""
      - "In the current state the role creates the following structure:"
      - ""
      - "- part1: 1 MB bios boot"
      - "- part2: LVM root with 100% of free space"
      - ""
      - "Afterwards logical volumes are created."
      - "These are specified in [`partitions_logical_volumes`](#partitions_logical_volumes)."
    author:
      - "lingling"
    options:
      partitions_activate_swap:
        type: "bool"
        default: false
        description:
          - "Whether swap should be activated during runtime."
      partitions_btrfs_subvolumes:
        type: "list"
        elements: "dict"
        default:
          - name: "@"
            path: "/"
            default: true
          - name: "@home"
            path: "/home"
          - name: "@opt"
            path: "/opt"
          - name: "@root"
            path: "/root"
          - name: "@srv"
            path: "/srv"
          - name: "@swap"
            path: "/swap"
          - name: "@var"
            path: "/var"
          - name: "@var-tmp"
            path: "/var/tmp"
          - name: "@usr-local"
            path: "/usr/local"
        description:
          - "Subvolumes for btrfs partitions"
        options:
          name:
            type: "str"
            required: true
            description:
              - "Name of the subvolume."
          path:
            type: "str"
            required: true
            description:
              - "Path (mount point) for the subvolume."
          default:
            type: "bool"
            required: false
            description:
              - "If this is set to true the subvolume will be set as default subvolume."
      partitions_chroot_path:
        type: "str"
        default: /target
        description:
          - "All mounted paths will be subpaths of this."
      partitions_device:
        type: "str"
        required: true
        description:
          - "The device, which partitions should be managed"
      partitions_esp_mount_point:
        type: "str"
        default: "/boot"
        description:
          - "The mount point of the EFI system partition (EFI)."
          - "Only applicable for UEFI systems."
          - "Please be sure to understand what you are doing before changing this value."
          - "Refer to [EFI system partition (ArchWiki)](https://wiki.archlinux.org/title/EFI_system_partition) for an overview."
      partitions_logical_volumes:
        type: "list"
        elements: "dict"
        default:
          - name: root
            fstype: ext4
            path: /
            size: 10G
          - name: log
            fstype: ext4
            size: 2G
            path: /var/log
          - name: home
            fstype: ext4
            size: 2G
            path: /home
          - name: swap
            fstype: swap
            size: 2G
        description:
          - "List of logical volumes to be created on the device."
        options:
          fstype:
            type: "str"
            required: false
            choices:
              - "bcachefs"
              - "btrfs"
              - "ext2"
              - "ext3"
              - "ext4"
              - "ext4dev"
              - "f2fs"
              - "lvm"
              - "ocfs2"
              - "reiserfs"
              - "xfs"
              - "vfat"
              - "swap"
              - "ufs"
            description:
              - "The filesystem type."
              - "If ommited, the partitions won't be formatted."
              - "The choices are copied from [community.general.filesystem](https://docs.ansible.com/ansible/latest/collections/community/general/filesystem_module.html#parameter-fstype) module."
              - "Please open an if a newly added filesystem is missing."
          name:
            type: "str"
            required: true
            description:
              - "Name of the logical volume."
          path:
            type: "str"
            required: false
            description:
              - "If provided, the logical volume will be mounted at this path."
              - "If [`partitions_chroot_path`](#partitions_chroot_path) is proveded, the paths will be mounted as subpaths of this."
          size:
            type: "str"
            required: true
            description:
              - "Size of the logical volume, e. g. 10G, 250M or '100%FREE'."
              - "Refer to [**lvcreate(8)**](https://manpages.debian.org/jessie/lvm2/lvcreate.8.en.html) for more information on size notation."
              - "The suffixes are described for the `--size` option and the percent notation for `--extents`, repectivetaly."
      partitions_root_partition_password:
        type: "str"
        required: false
        description:
          - "The password for the root partition."
          - "This implies that the partition will be encrypted by LUKS."
      partitions_root_partition_type:
        type: "str"
        required: true
        choices:
          - "btrfs"
          - "lvm"
        description:
          - "The type of the root partition."
      partitions_system_type:
        type: "str"
        default: "bios"
        choices:
          - "bios"
          - "uefi"
        description:
          - "Depending if the system has a BIOS or an UEFI different partitions need to be created."
      partitions_volume_group_name:
        type: "str"
        default: "vg0"
        description:
          - "Name of the volume group."
