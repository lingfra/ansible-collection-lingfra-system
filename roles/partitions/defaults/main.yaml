---
# Automatically generated by aar-doc
# The mount point of the EFI system partition (EFI).
# Only applicable for UEFI systems.
# Please be sure to understand what you are doing before changing this value.
# Refer to [EFI system partition (ArchWiki)](https://wiki.archlinux.org/title/EFI_system_partition) for an overview.
partitions_esp_mount_point: /boot
# List of logical volumes to be created on the device.
partitions_logical_volumes:
  - name: root
    fstype: ext4
    path: /
    size: 10G
  - name: log
    fstype: ext4
    size: 2G
    path: /var/log
  - name: home
    fstype: ext4
    size: 2G
    path: /home
  - name: swap
    fstype: swap
    size: 2G
# Whether swap should be activated during runtime.
partitions_activate_swap: false
# Depending if the system has a BIOS or an UEFI different partitions need to be created.
partitions_system_type: bios
# Name of the volume group.
partitions_volume_group_name: vg0
