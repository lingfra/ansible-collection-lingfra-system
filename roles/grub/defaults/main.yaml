---
# Automatically generated by aar-doc
grub_conf_cmdline_linux_default: []
grub_conf_cmdline_linux: []
grub_conf_default: '0'
grub_conf_disable_os_prober: true
grub_conf_disable_recovery: false
grub_conf_distributor: Arch
grub_conf_gfxmode: auto
grub_conf_gfxpayload_linux: keep
grub_conf_preload_modules:
  - part_gpt
  - part_msdos
grub_conf_savedefault: false
grub_conf_terminal_input: console
grub_conf_terminal_output: console
grub_conf_timeout: 5
grub_conf_timeout_style: menu
# Path to the GRUB configuration file.
grub_defaults_path: /etc/default/grub
# Specifies output path for the generation of the GRUB configuration file.
grub_mkconfig_output_path: /boot/grub/grub.cfg
