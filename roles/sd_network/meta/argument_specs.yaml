---
# argument specs file for sd_network

argument_specs:
  main:
    short_description: "Main entry point for sd_network role"
    description:
      - "This role is used to interpret tagged VLANs on (multiple) network devices (interfaces). To accomplish this, multiple concepts of [systemd-network](https://www.freedesktop.org/software/systemd/man/latest/systemd.network.html) are stacked."
      - "This results in five levels of configuration:"
      - ""
      - "1. Bind interface to VLAN networks."
      - "2. Define the VLAN networks."
      - "3. Define a bridge for every VLAN."
      - "4. Bind VLAN network to corresponding bridge."
      - "5. Configure the bridge. Currently, the only option is to enable or disable DHCP."
      - ""
      - "Starting from this entry point, the tasks [`device.yaml`](./tasks/device.yaml) are included. This is done for every list item in [`sd_network_device_vlan_list`](#sd_network_device_vlan_list). The tasks in [`device.yaml`](./tasks/device.yaml) make the basic configuration for the corresponding network device and create an accumulated VLAN list, which is needed in the next step. The next step is to include the [`vlan.yaml`](./tasks/vlan.yaml) for every specified VLAN."
    author:
      - lingling
    options:
      sd_network_device_vlan_list:
        type: "list"
        elements: "dict"
        default: []
        description:
          - "This list of dictionaries is the main configuration interface for this role."
          - "Every list item consists of a device name and a list of VLANs, which should be interpreted from this device."
          - "When this list is empty (the default) no actions are done."
        options:
          config_dir:
            type: "str"
            default: "/etc/systemd/network"
            description:
              - "Specifies the configuration parent directory for the network configuration files."
          device:
            type: "str"
            required: true
            description:
              - "The device the VLANs should be bound to. Need to be present on the target host."
          vlan_list:
            type: "list"
            elements: "dict"
            required: true
            required_together:
              - ["address", "gateway"]
            description:
              - "List of VLANs associated with the device."
            options:
              id:
                type: "int"
                required: true
                description:
                  - "Specifies the VLAN ID. This should be the same as configured in the router on the port."
              address:
                type: "str"
                required: false
                description:
                  - "A static address for the interface."
                  - "It is required to specify a gateway too, if an address is specified."
              create_bridge:
                type: "bool"
                required: false
                description:
                  - "Whether a bridge device for this VLAN should be created or not."
                  - "If unspecified the value of `sd_network_create_bridge_default` is used."
                  - "When this is set to `false`, the bridge configuration files (`30-bridge.netdev` and `50-bridge.network`) are not created . However, the filenames are still composed and used to delete possible leftover configuration from previous executions."
              dhcp:
                type: "bool"
                required: false
                description:
                  - "Whether DHCP should be activated on the resulting interface or not."
                  - "If unspecified the value of [`sd_network_dhcp_default`](#sd_network_dhcp_default) is used."
                  - "Depending if a bridge for this VLAN is created or not, DHCP is activated at different places. When a bridge is assigned to the VLAN, then DHCP is specified in `50-bridge.network`. If the VLAN has no corresponding bridge DHCP is activated in `40-vlan.network`."
              gateway:
                type: "str"
                required: false
                description:
                  - "If an address is specified it is required to specify a gateway too."

      sd_network_create_bridge_default:
        type: "bool"
        default: true
        description:
          - "This variable defines a fallback for the field `sd_network_device_vlan_list.vlan_list.create_bridge`, refer to the documentation of that option for more information."
          - "By default this is `true`. This leads to the creation of a bridge for every VLAN."
      sd_network_dhcp_default:
        type: "bool"
        default: false
        description:
          - "This variable defines a fallback for the field `sd_network_device_vlan_list.vlan_list.dhcp`, refer to the documentation of that option for more information."
          - "By default this is `false` to avoid accidently adding the host to multiple networks."

# End of file
