---
# tasks file for sd_network

- name: "Include tasks device.yaml"
  ansible.builtin.include_tasks:
    file: device.yaml
  loop: "{{ sd_network_device_vlan_list }}"
  loop_control:
    loop_var: device
    label: "{{ device.device | default('N/A') }}"
  vars:
    device_bind_network_file: "{{ (device.config_dir | default(sd_network_systemd_network_dir), '10-bind-' ~ device.device ~'.network') | path_join }}"

# End of file
