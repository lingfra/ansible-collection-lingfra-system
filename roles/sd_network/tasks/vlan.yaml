---
# tasks file for sd_network

- name: "Template {{ vlan.files.vlan_netdev }}"
  ansible.builtin.template:
    src: vlan.netdev.j2
    dest: "{{ vlan.files.vlan_netdev }}"
    owner: root
    group: root
    mode: "0644"
  become: true

- name: "Template {{ vlan.files.bridge_netdev }}"
  ansible.builtin.template:
    src: bridge.netdev.j2
    dest: "{{ vlan.files.bridge_netdev }}"
    owner: root
    group: root
    mode: "0644"
  become: true
  when:
    - vlan.create_bridge

- name: "Remove {{ vlan.files.bridge_netdev }}"
  ansible.builtin.file:
    path: "{{ vlan.files.bridge_netdev }}"
    state: absent
  become: true
  when:
    - not vlan.create_bridge

- name: "Template {{ vlan.files.vlan_network }}"
  ansible.builtin.template:
    src: vlan.network.j2
    dest: "{{ vlan.files.vlan_network }}"
    owner: root
    group: root
    mode: "0644"
  become: true

- name: "Template {{ vlan.files.bridge_network }}"
  ansible.builtin.template:
    src: bridge.network.j2
    dest: "{{ vlan.files.bridge_network }}"
    owner: root
    group: root
    mode: "0644"
  become: true
  when:
    - vlan.create_bridge

- name: "Remove {{ vlan.files.bridge_network }}"
  ansible.builtin.file:
    path: "{{ vlan.files.bridge_network }}"
    state: absent
  become: true
  when:
    - not vlan.create_bridge

# End of file
