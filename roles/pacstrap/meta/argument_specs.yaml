---
# argument specs file for pacstrap

argument_specs:
  main:
    short_description: "Main entry point for pacstrap role"
    description:
      - "This is a rather simple role, which executes [**pacstrap(8)**](https://man.archlinux.org/man/pacstrap.8) on a folder."
      - "The roles makes checks, so the result is idempotent and pacstrap is not executed on an already pacstrapped folder."
    author:
      - "lingling"
    options:
      pacstrap_chroot_path:
        type: "str"
        required: true
        description:
          - "This is the target path for the pacstrap installation."
      pacstrap_packages:
        type: "list"
        elements: "str"
        default:
          - "linux-firmware"
          - "reflector"
          - "man-db"
          - "man-pages"
          - "neovim"
          - "sudo"
          - "e2fsprogs"
          - "lvm2"
          - "grub"
          - "python"
          - "tmux"
          - "qemu-guest-agent"
        description:
          - "List of packages, which should be installed by pacstrap."
          - "The packages `base` and `linux-firmware` need not to be specified, they are installed by default."
