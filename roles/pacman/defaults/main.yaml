---
# Automatically generated by aar-doc
# Whether the [pacman-contrib](https://archlinux.org/packages/extra/x86_64/pacman-contrib/) package should be present or not.
# [pacman-contrib](https://gitlab.archlinux.org/pacman/pacman-contrib) provides extra scripts for interacting with pacman.
pacman_contrib: true
# Initialize the pacman keyring.
pacman_init_keyring: false
# Custom list of mirrors for pacman.
# Mutually exclusive with [`pacman_reflector`](#pacman_reflector).
pacman_mirrorlist: []
# Installs paccache and enables the timer for regular pacman cache cleaning.
# Refer to [**paccache(8)**](https://man.archlinux.org/man/paccache.8) for more information.
# Paccache is part of [pacman-contrib](https://archlinux.org/packages/extra/x86_64/pacman-contrib/) and therefore [`pacman_contrib`](#pacman_contrib) need to be `true`.
pacman_paccache: false
# Whether [reflector](https://wiki.archlinux.de/title/Reflector) should be installed and activated or not.
# Refer to [**reflector(1)**](https://man.archlinux.org/man/reflector.1) for more information.
# Mutually exclusive with [`pacman_mirrorlist`](#pacman_mirrorlist).
pacman_reflector: false
# List of official Arch Linux repositories to be enabled.
pacman_repos:
  - core
  - extra
# The main mirror server for the official Arch Linux repositories.
# Will have precedence over the mirrors specified in `/etc/pacman.d/mirrorlist`.
# The default of this variable should be a worldwide available pacman mirror as returned by [Pacman Mirrorlist Generator](https://archlinux.org/mirrorlist/).
# If this mirror deprecated some day, please open an issue.
# This variable has a default primary for bootstraping reasons.
# If you do not want specify a main server for official pacman repositories set this variable to an empty string.
pacman_server: https://mirror.rackspace.com/archlinux/$repo/os/$arch
# Whether or a full system upgrade should be done.
# This is a non-idempotent action and therefore only recommended for the first provisioning.
# In the case of first provisioning this should be used together with `pacman_init=true`.
pacman_upgrade_system: false
