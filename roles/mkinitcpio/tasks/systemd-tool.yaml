---
# tasks file for mkinitcpio

- name: "Install dependencies for mkinitcpio-systemd-tool"
  community.general.pacman:
    name: "{{ mkinitcpio_systemd_tool_packages }}"
    update_cache: true
  become: true
  when:
    - mkinitcpio_systemd_tool_setup

- name: "Add sysroot entry to /etc/mkinitcpio-systemd-tool/config/crypttab"
  ansible.builtin.copy:
    content: "{{ mkinitcpio_systemd_tool_crypttab_entry | join(' ') }}"
    dest: /etc/mkinitcpio-systemd-tool/config/crypttab
    owner: root
    group: root
    mode: "0400"
  become: true

- name: "Add sysroot entry to /etc/mkinitcpio-systemd-tool/config/fstab"
  ansible.builtin.copy:
    content: "{{ mkinitcpio_systemd_tool_fstab_entry | join(' ') }}"
    dest: /etc/mkinitcpio-systemd-tool/config/fstab
    owner: root
    group: root
    mode: "0400"
  become: true

- name: "Enable required services"
  ansible.builtin.systemd:
    name: "{{ service }}"
    enabled: true
  become: true
  loop:
    - initrd-cryptsetup.path
    - initrd-tinysshd
    - initrd-debug-progs
    - initrd-sysroot-mount
  loop_control:
    loop_var: service

- name: "Copy SSH public key to /etc/mkinitcpio-systemd-tool/config/authorized_keys"
  ansible.builtin.copy:
    src: "{{ mkinitcpio_internal_ssh_pub_key }}"
    dest: /etc/mkinitcpio-systemd-tool/config/authorized_keys
    owner: root
    group: root
    mode: "0600"
  become: true

# End of file
