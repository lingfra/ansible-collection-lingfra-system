---
# tasks file for mkinitcpio

- name: Check mkinitcpio hooks requirements for systemd-tool
  ansible.builtin.assert:
    that:
      - ('base' in mkinitcpio_conf_hooks)
      - ('systemd' in mkinitcpio_conf_hooks)
      - ('sd-encrypt' not in mkinitcpio_conf_hooks)
      - ('systemd-tool' in mkinitcpio_conf_hooks)
    fail_msg: |
      mkinitcpio-systemd-tool requires following hooks:

        - base
        - systemd
        - systemd-tool

      It is also mutually exclusive with sd-encrypt, because it replaces its functionally.
    success_msg: mkinitcpio hook requirements for systemd-tool given.
    quiet: true
  when:
    - mkinitcpio_systemd_tool_setup

- name: Stat ssh pub key on controller
  ansible.builtin.stat:
    path: "{{ mkinitcpio_internal_ssh_pub_key }}"
  delegate_to: localhost
  register: stat_ssh_pub_key
  run_once: true

- name: Check that ssh public key exists on controller
  ansible.builtin.assert:
    that:
      - stat_ssh_pub_key.stat.exists
    fail_msg: |
      The SSH public key {{ mkinitcpio_internal_ssh_pub_key }} does not exist.

      Check the variable mkinitcpio_systemd_tool_ssh_pub_key.
    success_msg: Specified SSH public key file exists.
    quiet: true

# End of file
