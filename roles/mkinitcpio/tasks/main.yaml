---
# tasks file for mkinitcpio

# ---------- Checks ----------

- name: "Validate internal role variables"
  ansible.builtin.validate_argument_spec:
    argument_spec: "{{ (lookup('ansible.builtin.file', 'meta/argument_specs.yaml')
        | from_yaml)['argument_specs']['internal']['options'] }}"
  tags:
    - checks
    - mkinitcpio

- name: "Check mkinitcpio hooks requirements for systemd-tool"
  ansible.builtin.assert:
    that:
      - ('base' in mkinitcpio_conf_hooks)
      - ('systemd' in mkinitcpio_conf_hooks)
      - ('sd-encrypt' not in mkinitcpio_conf_hooks)
      - ('systemd-tool' in mkinitcpio_conf_hooks)
    fail_msg: |
      mkinitcpio-systemd-tool requires following hooks:

        - base
        - systemd
        - systemd-tool

      It is also mutually exclusive with sd-encrypt, because it replaces its functionally.
    success_msg: mkinitcpio hook requirements for systemd-tool given.
    quiet: true
  tags:
    - checks
    - mkinitcpio
  when:
    - mkinitcpio_sd_tool_enable

# ---------- mkinitcpio-systemd-tool ----------

- name: Import role lingfra.system.mkinitcpio_sd_tool
  ansible.builtin.import_role:
    name: lingfra.system.mkinitcpio_sd_tool
  vars:
    mkinitcpio_sd_tool_chroot_path: "{{ mkinitcpio_chroot_path | default('') }}"
  when:
    mkinitcpio_sd_tool_enable

# ---------- Configuration ----------

- name: "Template mkinitcpio.conf"
  ansible.builtin.template:
    src: mkinitcpio.conf.j2
    dest: "{{ mkinitcpio_conf_path | lingfra.system.chrooted_path(mkinitcpio_chroot_path | default(none)) }}"
    owner: root
    group: root
    mode: "0644"
    backup: true
  become: true
  diff: true
  tags:
    - configuration
    - mkinitcpio
  register: template_mkinitcpio_result

- name: "Set fact mkinitcpio_conf_backup_file"
  ansible.builtin.set_fact:
    mkinitcpio_conf_backup_file: "{{ template_mkinitcpio_result.backup_file | default(none) }}"

# ---------- Building ----------

- name: "Build initramfs"
  tags:
    - build
    - mkinitcpio

  block:
    - name: "Include tasks build_initramfs"
      ansible.builtin.include_tasks:
        file: build_initramfs.yaml
        apply:
          tags:
            - build
            - mkinitcpio
      when:
        - mkinitcpio_build_initramfs
        - template_mkinitcpio_result.changed or
          (mkinitcpio_sd_tool_changed | default(false)) or
          mkinitcpio_force_build

  rescue:
    - name: "Fail if no backup file is found"
      ansible.builtin.fail:
        msg: "The creation of the initramfs image failed and there is no backup file to restore."
      when:
        - not mkinitcpio_conf_backup_file

    - name: "Restore mkinitcpio.conf file from backup"
      ansible.builtin.copy:
        remote_src: true
        src: "{{ mkinitcpio_conf_backup_file }}"
        dest: "{{ mkinitcpio_conf_path }}"
        owner: root
        group: root
        mode: "0644"
      become: true

    - name: "Include tasks build_initramfs for old configuration"
      ansible.builtin.include_tasks:
        file: build_initramfs.yaml
        apply:
          tags:
            - build
            - mkinitcpio

  always:
    - name: "Remove mkinitcpio.conf backup file"
      ansible.builtin.file:
        path: "{{ mkinitcpio_conf_backup_file }}"
        state: absent
      become: true
      tags:
        - clean-up
        - mkinitcpio
      when:
        - mkinitcpio_conf_backup_file is not none

# ---------- Clean-Up ----------

- name: "Nullify runtime variables for mkinitcpio"
  ansible.builtin.set_fact:
    mkinitcpio_built_result: null
    mkinitcpio_conf_backup_file: null
    template_mkinitcpio_result: null
  tags:
    - clean-up
    - mkinitcpio
