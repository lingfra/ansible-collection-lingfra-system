---
# tasks file for mkinitcpio

- name: Check public role variables
  ansible.builtin.assert:
    that:
      # mkinitcpio_conf_binaries is a list
      - mkinitcpio_conf_binaries is defined
      - mkinitcpio_conf_binaries is not none
      - mkinitcpio_conf_binaries is not string
      - mkinitcpio_conf_binaries is not mapping
      - mkinitcpio_conf_binaries is iterable

      # mkinitcpio_conf_files is a list
      - mkinitcpio_conf_files is defined
      - mkinitcpio_conf_files is not none
      - mkinitcpio_conf_files is not string
      - mkinitcpio_conf_files is not mapping
      - mkinitcpio_conf_files is iterable

      # mkinitcpio_conf_hooks is a list
      - mkinitcpio_conf_hooks is defined
      - mkinitcpio_conf_hooks is not none
      - mkinitcpio_conf_hooks is not string
      - mkinitcpio_conf_hooks is not mapping
      - mkinitcpio_conf_hooks is iterable

      # mkinitcpio_conf_modules is a list
      - mkinitcpio_conf_modules is defined
      - mkinitcpio_conf_modules is not none
      - mkinitcpio_conf_modules is not string
      - mkinitcpio_conf_modules is not mapping
      - mkinitcpio_conf_modules is iterable

      # mkinitcpio_conf_path is a string
      - mkinitcpio_conf_path is defined
      - mkinitcpio_conf_path is not none
      - mkinitcpio_conf_path is string
      - mkinitcpio_conf_path | length > 0
    fail_msg: Bad syntax for public role variables.
    success_msg: All assertions passed.
    quiet: true

- name: Set internal fact mkinitcpio_internal_ssh_pub_key
  ansible.builtin.set_fact:
    mkinitcpio_internal_ssh_pub_key: "{{ lookup('env', 'HOME') }}/.ssh/{{ mkinitcpio_systemd_tool_ssh_pub_key }}"
  when:
    - mkinitcpio_systemd_tool_setup

- name: Include sytemd-tool checks
  ansible.builtin.include_tasks:
    file: systemd-tool-checks.yaml
  when:
    - mkinitcpio_systemd_tool_setup

- name: Include sytemd-tool tasks
  ansible.builtin.include_tasks:
    file: systemd-tool.yaml
  when:
    - mkinitcpio_systemd_tool_setup
  register: setup_systemd_tool

- name: Template mkinitcpio.conf
  ansible.builtin.template:
    src: mkinitcpio.conf.j2
    dest: "{{ mkinitcpio_conf_path }}"
    owner: root
    group: root
    mode: "0644"
    backup: true
  become: true
  diff: true
  register: template_mkinitcpio

- name: Write backup file to variable
  ansible.builtin.set_fact:
    mkinitcpio_conf_backup_file: "{{ template_mkinitcpio.backup_file }}"
  when: template_mkinitcpio.backup_file is defined

- name: Build initramfs
  when:
    - mkinitcpio_build_initramfs
    - template_mkinitcpio.changed
    # ToDo: Build initramfs also when there are changed for systemd-tool.

  block:
    - name: Include tasks build_initramfs
      ansible.builtin.include_tasks:
        file: build_initramfs.yaml

  rescue:
    - name: Restore old mkinitcpio.conf file
      ansible.builtin.copy:
        remote_src: true
        src: "{{ mkinitcpio_conf_backup_file }}"
        dest: "{{ mkinitcpio_conf_path }}"
        owner: root
        group: root
        mode: "0644"
      become: true

    - name: Include tasks build_initramfs for old configuration.
      ansible.builtin.include_tasks:
        file: build_initramfs.yaml

  always:
    - name: Nullify command_mkinitcpio variable
      ansible.builtin.set_fact:
        command_mkinitcpio: null

- name: Delete backup file if exists
  ansible.builtin.file:
    path: "{{ mkinitcpio_conf_backup_file }}"
    state: absent
  become: true
  diff: true
  when:
    - mkinitcpio_conf_backup_file is defined

- name: Nullify runtime variables
  ansible.builtin.set_fact:
    template_mkinitcpio: null
    mkinitcpio_conf_backup_file: null
    mkinitcpio_internal_ssh_pub_key: null

# End of file
