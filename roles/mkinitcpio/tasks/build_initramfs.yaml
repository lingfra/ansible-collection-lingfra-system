---
# tasks file for mkinitcpio

- name: "Execute mkinitcpio to build initramfs"
  ansible.builtin.command:
    argv: "{{ mkinitcpio_built_command_argv | lingfra.system.arch_chroot_argv(mkinitcpio_chroot_dir | default(none)) }}"
  become: true
  changed_when: true
  register: mkinitcpio_built_result

- name: "Print output from mkinitcpio"
  ansible.builtin.debug:
    msg: "{{ lookup('ansible.builtin.template', 'command_output.j2') }}"
  vars:
    command: "{{ mkinitcpio_built_result }}"
  when:
    - mkinitcpio_built_result.rc == 0
