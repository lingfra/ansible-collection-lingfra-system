---
# tasks file for mkinitcpio

- name: Execute mkinitcpio to build initramfs
  ansible.builtin.command:
    cmd: mkinitcpio -P
  become: true
  changed_when: true
  register: command_mkinitcpio

- name: Print output from mkinitcpio
  ansible.builtin.debug:
    msg: "{{ lookup('ansible.builtin.template', 'command_output.j2') }}"
  vars:
    command: "{{ command_mkinitcpio }}"
  when:
    - command_mkinitcpio.rc == 0

# End of file
