---
# tasks file for lingfra.system.sd_resolved

- name: "Create directory {{ sd_resolved_config_dir }}"
  ansible.builtin.file:
    path: "{{ sd_resolved_config_dir | lingfra.system.chrooted_path(sd_resolved_chroot_path | default(none)) }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  become: true

- name: "Template systemd resolved config file"
  ansible.builtin.template:
    src: systemd-resolved.conf.j2
    dest: "{{ sd_resolved_conf_file_path }}"
    owner: root
    group: root
    mode: "0644"
  become: true
  notify:
    - Restart systemd-resolved
  vars:
    sd_resolved_conf_file_path: "{{ (sd_resolved_config_dir | lingfra.system.chrooted_path(sd_resolved_chroot_path | default(none)), '50-llmr.conf') | path_join }}"

- name: "Symlink stub-resolve"
  ansible.builtin.file:
    path: "{{ '/etc/resolv.conf' | lingfra.system.chrooted_path(sd_resolved_chroot_path | default(none)) }}"
    src: /run/systemd/resolve/stub-resolv.conf
    state: link
    force: true
  become: true
  notify:
    - Restart systemd-resolved

- name: "Enable and start systemd-resolved"
  ansible.builtin.systemd:
    name: systemd-resolved.service
    enabled: true
  become: true
  when:
    - sd_resolved_chroot_path is not defined
